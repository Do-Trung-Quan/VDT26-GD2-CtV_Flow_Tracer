# Cấu hình mặc định — mọi giá trị nhạy cảm đọc từ biến môi trường (xem .env.example ở gốc repo)
server:
  port: ${APP_PORT:8600}
  address: ${BIND_HOST:127.0.0.1}

spring:
  application:
    name: flowtracer
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowtracer}
    username: ${DB_USER:flowtracer}
    password: ${DB_PASSWORD:flowtracer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Ghi theo lô (vd danh sách file của lần quét) thay vì từng câu lệnh
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

flowtracer:
  source-root: ${SOURCE_ROOT:.}
  data-dir: ${DATA_DIR:./.data}
  scan:
    workers: ${SCAN_WORKERS:0}
    max-file-size-kb: ${MAX_FILE_SIZE_KB:1024}
    default-max-depth: 12
  sidecar:
    node-command: ${SIDECAR_NODE:node}
    cli-path: ${SIDECAR_CLI:../analyzer-node/dist/cli.js}
    timeout: ${SIDECAR_TIMEOUT:PT10M}
    max-old-space-mb: ${SIDECAR_MAX_OLD_SPACE_MB:2048}
  ai:
    provider: ${LLM_PROVIDER:none}
    model: ${LLM_MODEL:}
    base-url: ${LLM_BASE_URL:}
    daily-token-limit: ${LLM_DAILY_TOKEN_LIMIT:0}
    log-content: ${LLM_LOG_CONTENT:true}
