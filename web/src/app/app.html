<header class="hdr">
  <button class="hbtn icon" type="button" (click)="toggleRail()" [attr.aria-expanded]="railWide()" aria-controls="mainRail"
    [title]="railWide() ? 'Thu gọn menu' : 'Mở rộng menu'" aria-label="Mở / thu gọn menu">
    <app-icon name="menu" />
  </button>
  <a class="logo" routerLink="/" title="Danh sách Workspace"><b>CtV</b><span class="topbar">Flow Tracer</span></a>
  <div class="hsep"></div>
  <app-select-menu variant="header" icon="folder" ariaLabel="Chọn Workspace" placeholder="Chọn Workspace" currentHint="đang mở"
    [options]="workspaceOptions()" [value]="ctx.currentId()" [actions]="workspaceActions" (changed)="selectWorkspace($event)"
    (action)="onWorkspaceAction($event)" />
  <div class="sp1 center">
    <button class="hsearch" type="button" (click)="openPalette()"
      [title]="ctx.currentId() ? 'Tìm kiếm nhanh trong Workspace đang mở' : 'Chọn một Workspace để tìm kiếm'">
      <app-icon name="search" [small]="true" />
      <span class="ht">{{ searchHint() }}</span>
      <kbd>Ctrl K</kbd>
    </button>
  </div>
  <a class="hai" routerLink="/settings/ai" [title]="aiTitle()">
    <span [class]="'dot ' + ai.lamp().lamp"></span>{{ ai.lamp().label }}
  </a>
  <button class="hbtn solid" type="button" (click)="ctx.importOpen.set(true)">
    <app-icon name="upload" [small]="true" />Import dự án
  </button>
</header>

<div class="body">
  <nav id="mainRail" class="rail" [class.wide]="railWide()" aria-label="Điều hướng">
    <a class="ri" routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" title="Danh sách Workspace">
      <app-icon name="home" /><span>Danh sách Workspace</span>
    </a>
    @if (ctx.currentId(); as id) {
      <a class="ri" [routerLink]="['/w', id]" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" title="Chi tiết Workspace">
        <app-icon name="layout" /><span>Chi tiết Workspace</span>
      </a>
      <a class="ri" [routerLink]="['/w', id, 'settings']" routerLinkActive="on" title="Cài đặt Workspace">
        <app-icon name="gear" /><span>Cài đặt Workspace</span>
      </a>
    }
    <a class="ri" routerLink="/settings/ai" routerLinkActive="on" title="Cấu hình AI">
      <app-icon name="sparkle" /><span>Cấu hình AI</span>
    </a>
  </nav>
  <main>
    <router-outlet />
  </main>
</div>

<app-toast-host />
<app-scan-toast />

@if (ctx.importOpen()) {
  <app-import-wizard (closed)="ctx.importOpen.set(false)" />
}

@if (ctx.paletteOpen() && ctx.currentId(); as id) {
  <app-search-palette [workspaceId]="id" (picked)="openHit(id, $event)" (closed)="ctx.paletteOpen.set(false)" />
}
